<app-desktop-header></app-desktop-header>

<!-- HEADER MOBILE -->
<ion-header class="ion-no-border mobile-header">
  <ion-toolbar>
    <div class="header-content">
      <img src="assets/logo.svg" alt="MySchool Logo" class="logo" />
      <ion-button fill="clear" (click)="goToProfile()" class="profile-button">
        <ion-icon class="profile" name="person-circle-outline"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-header>

<!-- DESKTOP HEADER AVEC RECHERCHE -->
<div class="desktop-header-search">
  <div class="desktop-search-wrapper">
    <h1 class="desktop-main-title">Les cours</h1>

    <div class="desktop-search-container">
      <ion-searchbar placeholder="Rechercher un cours" (ionInput)="searchCourse($event)"
        class="desktop-custom-searchbar">
      </ion-searchbar>
      <ion-button fill="clear" class="desktop-filter-button" (click)="openFilters()">
        <ion-icon slot="start" name="options-outline"></ion-icon>
        FILTRES
      </ion-button>
    </div>

    <!-- Segment pour les onglets - DESKTOP -->
    <ion-segment [value]="selectedSegment" (ionChange)="onSegmentChange($event)" class="desktop-custom-segment">
      <ion-segment-button value="cours-en-ligne">
        <ion-label>Cours video</ion-label>
      </ion-segment-button>
      <ion-segment-button value="cours">
        <ion-label>Cours en ligne</ion-label>
      </ion-segment-button>
      <ion-segment-button value="tutoriel">
        <ion-label>Tutoriel</ion-label>
      </ion-segment-button>
    </ion-segment>
  </div>
</div>

<!-- CONTENU PRINCIPAL -->
<ion-content class="ion-padding">
  <div class="content-wrapper">
    <!-- MOBILE: Titre et Segment -->
    <div class="mobile-header-section">
      <h1 class="main-title">Les cours</h1>

      <!-- Segment pour les onglets - MOBILE -->
      <ion-segment [value]="selectedSegment" (ionChange)="onSegmentChange($event)" class="custom-segment">
        <ion-segment-button value="cours-en-ligne">
          <ion-label>Cours video</ion-label>
        </ion-segment-button>
        <ion-segment-button value="cours">
          <ion-label>Cours en ligne</ion-label>
        </ion-segment-button>
        <ion-segment-button value="tutoriel">
          <ion-label>Tutoriel</ion-label>
        </ion-segment-button>
      </ion-segment>

      <!-- Barre de recherche et filtres - MOBILE -->
      <div class="search-filter-container">
        <ion-searchbar placeholder="Rechercher un cours" (ionInput)="searchCourse($event)" class="custom-searchbar">
        </ion-searchbar>
        <ion-button fill="clear" class="filter-button" (click)="openFilters()">
          <ion-icon slot="start" name="options-outline"></ion-icon>
          Filtres
        </ion-button>
      </div>
    </div>

    <!-- Message de chargement -->
    <div *ngIf="isLoading" class="loading-container">
      <ion-icon name="hourglass-outline"></ion-icon>
      <p>Chargement des cours...</p>
    </div>

    <!-- Message si aucun cours -->
    <div *ngIf="!isLoading && filteredCourses.length === 0" class="empty-container">
      <ion-icon name="book-outline"></ion-icon>
      <p>Aucun cours disponible</p>
    </div>

    <!-- Liste des cours par catégorie -->
    <div class="courses-container" *ngIf="!isLoading && filteredCourses.length > 0">
      <ng-container *ngFor="let category of getFilteredCategories()">
        <h2 class="category-title">{{ category }}</h2>
        <div class="courses-row">
          <ion-card *ngFor="let course of getCoursesByCategory(category)" class="course-card"
            (click)="openCourse(course)">
            <div class="card-image">
              <img [src]="course?.image" alt="Instructeur" class="instructor-image" />
              <div class="card-badge">
                <ion-icon name="lock-open-outline"></ion-icon>
              </div>
            </div>
            <ion-card-content>
              <div *ngIf="course.certificateAvailable" class="status-badge">
                <ion-icon name="checkmark-circle" class="check-icon"></ion-icon>
                <span>Certificat disponible</span>
              </div>
              <h3 class="course-title">{{course.title}}</h3>
              <div class="course-info">
                <span class="exercises">{{course.exercises}} Exercices</span>
              </div>
            </ion-card-content>
          </ion-card>
        </div>
      </ng-container>
    </div>
  </div>
</ion-content>

<app-bottom-menu class="mobile-header" activePage="courses"></app-bottom-menu>
