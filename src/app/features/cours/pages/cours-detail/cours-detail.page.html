<ion-header class="ion-no-border transparent-header">
  <ion-toolbar class="transparent-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()" class="back-button">
        <ion-icon name="chevron-back-outline" class="back-icon"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="header-title">Page Cours</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="content-wrapper">
    <!-- Image de couverture avec overlay -->
    <div class="cover-image-container">
      <img src="assets/algo.svg" alt="MySchool Logo" class="cover-image">
      <div class="image-overlay"></div>
    </div>

    <!-- Contenu principal -->
    <div class="main-content">
      <!-- Badge Certificat        
         <ion-icon name="checkmark-circle" class="cert-icon"></ion-icon>-->
      <div class="certificate-badge">
        <img src="assets/icon-rosette.svg" alt="" class="cert-icon">
        <span>Certificat Disponible</span>
      </div>

      <!-- Titre du cours -->
      <h1 class="course-title">{{course.title}}</h1>

      <!-- Info sessions et exercices -->
      <div class="course-meta">
        <span class="sessions">{{course.sessions}} Sessions</span>
        <span class="separator">·</span>
        <span class="exercises">{{course.exercises}} Exercices</span>
      </div>

      <!-- Langue et instructeur -->
      <div class="course-info-row">
        <div class="info-item">
          <ion-icon name="language-outline" class="info-icon"></ion-icon>
          <span>Cours en <strong>{{course.language}}</strong></span>
        </div>
        <div class="info-item">
          <span>Par <strong class="instructor-name">{{course.instructor}}</strong></span>
        </div>
      </div>

      <!-- Note avec étoiles -->
      <div class="rating-container">
        <div class="stars">
          <ion-icon name="star" class="star-icon filled"></ion-icon>
          <ion-icon name="star" class="star-icon filled"></ion-icon>
          <ion-icon name="star" class="star-icon filled"></ion-icon>
          <ion-icon name="star" class="star-icon filled"></ion-icon>
          <ion-icon name="star-half" class="star-icon filled"></ion-icon>
        </div>
        <span class="rating-text">{{course.rating}}/{{course.maxRating}}</span>
      </div>

      <!-- Niveaux/Progression -->
      <div class="levels-container">
        <div *ngFor="let level of course.levels; let i = index" class="level-item">
          <div class="level-icon-wrapper" [class.completed]="level.completed">
            <ion-icon [name]="level.icon" class="level-icon"></ion-icon>
          </div>
          <div *ngIf="i < course.levels.length - 1" class="level-connector" [class.completed]="level.completed"></div>
        </div>
      </div>

      <!-- Description -->
      <div class="description-section">
        <h2 class="section-title">Description cours</h2>
        <p class="description-text">{{course.description}}</p>
      </div>

      <!-- Bouton d'inscription -->
    <ion-card class="enroll-card">
      <ion-card-content class="enroll-card-content">
        <ion-button expand="block" class="enroll-button" (click)="enrollNow()">
          <div class="button-content">
            <span class="button-main-text">S'inscrire maintenant</span>
            <span class="button-subtitle">Certificat inclus</span>
          </div>
        </ion-button>
      </ion-card-content>
    </ion-card>
    </div>
  </div>
</ion-content>
