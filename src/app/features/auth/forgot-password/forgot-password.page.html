<!-- forgot-password.page.html -->
<ion-content class="forgot-container">
  
  <div class="logo-section">
    <div class="logo-circle">
      <ion-icon name="lock-closed-outline"></ion-icon>
    </div>
    <h1>Réinitialiser</h1>
    <h2>votre mot de passe</h2>
  </div>

  <!-- ÉTAPE 1 : NUMÉRO -->
  <ion-card *ngIf="step === 0" class="step-card">
    <ion-card-content>
      <div class="step-header">
        <ion-icon name="phone-portrait-outline" class="step-icon"></ion-icon>
        <h3>Entrez votre numéro</h3>
        <p>Nous vous enverrons un code de vérification</p>
      </div>

      <form [formGroup]="phoneForm">
        <ion-item lines="none" class="custom-input">
          <ion-input
            type="tel"
            formControlName="phone"
            placeholder="+221 77 000 00 00"
            class="styled-input">
          </ion-input>
        </ion-item>

        <ion-button
          expand="block"
          class="primary-btn"
          (click)="sendCode()"
          [disabled]="phoneForm.invalid">
          Envoyer le code
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>

  <!-- ÉTAPE 2 : CODE -->
  <ion-card *ngIf="step === 1" class="step-card">
    <ion-card-content>
      <div class="step-header">
        <ion-icon name="checkmark-circle-outline" class="step-icon"></ion-icon>
        <h3>Code de vérification</h3>
        <p class="masked-phone">Envoyé au {{ maskedPhone }}</p>
      </div>

      <form [formGroup]="codeForm">
        <ion-item lines="none" class="custom-input">
          <ion-input
            type="number"
            formControlName="code"
            placeholder="000000"
            class="styled-input code-input">
          </ion-input>
        </ion-item>

        <ion-button
          expand="block"
          class="primary-btn"
          (click)="verifyCode()"
          [disabled]="codeForm.invalid">
          Vérifier
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>

  <!-- ÉTAPE 3 : NOUVEAU MOT DE PASSE -->
  <ion-card *ngIf="step === 2" class="step-card">
    <ion-card-content>
      <div class="step-header">
        <ion-icon name="lock-closed-outline" class="step-icon"></ion-icon>
        <h3>Nouveau mot de passe</h3>
        <p>Créez un mot de passe sécurisé</p>
      </div>

      <form [formGroup]="passwordForm">
        <ion-item lines="none" class="custom-input">
          <ion-input 
            type="password" 
            formControlName="password"
            placeholder="Mot de passe"
            class="styled-input">
          </ion-input>
        </ion-item>

        <ion-item lines="none" class="custom-input">
          <ion-input 
            type="password" 
            formControlName="confirmPassword"
            placeholder="Confirmer le mot de passe"
            class="styled-input">
          </ion-input>
        </ion-item>

        <p class="error-msg" *ngIf="passwordsMismatch() && passwordForm.value.confirmPassword">
          ⚠️ Les mots de passe ne correspondent pas
        </p>

        <ion-button
          expand="block"
          class="success-btn"
          (click)="resetPassword()"
          [disabled]="passwordForm.invalid || passwordsMismatch()">
          Réinitialiser
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>

</ion-content>
