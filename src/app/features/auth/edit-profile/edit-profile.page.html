<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="chevron-back-outline"></ion-icon>
        <span class="back-text">Retour</span>
      </ion-button>
    </ion-buttons>
    <ion-title>Modifier le profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="edit-profile-container">

    <!-- Avatar -->
    <div class="avatar-section">
      <div class="avatar-container">
        <div class="avatar-circle">
          <img
            *ngIf="profileForm.photoURL"
            [src]="profileForm.photoURL"
            alt="Photo de profil"
          />
          <div *ngIf="!profileForm.photoURL" class="avatar-placeholder">
            {{ profileForm.firstName.charAt(0) || 'A' }}
          </div>
        </div>
        <button class="camera-button" (click)="selectImage()">
          <ion-icon name="camera-outline"></ion-icon>
        </button>
      </div>
      <p class="change-photo-text">Modifier la photo</p>
    </div>

    <!-- Formulaire -->
    <form class="profile-form">

      <!-- Prénom -->
      <div class="form-group">
        <label class="form-label">Prénom</label>
        <ion-item lines="none" class="form-item">
          <ion-input
            [(ngModel)]="profileForm.firstName"
            name="firstName"
            type="text"
            placeholder="Votre prénom">
          </ion-input>
        </ion-item>
      </div>

      <!-- Nom -->
      <div class="form-group">
        <label class="form-label">Nom</label>
        <ion-item lines="none" class="form-item">
          <ion-input
            [(ngModel)]="profileForm.lastName"
            name="lastName"
            type="text"
            placeholder="Votre nom">
          </ion-input>
        </ion-item>
      </div>

      <!-- Téléphone -->
      <div class="form-group">
        <label class="form-label">Téléphone</label>
        <ion-item lines="none" class="form-item">
          <ion-input
            [(ngModel)]="profileForm.phone"
            name="phone"
            type="tel"
            placeholder="+221 77 000 00 00">
          </ion-input>
        </ion-item>
      </div>

      <!-- Bouton sauvegarde -->
      <ion-button
        expand="block"
        class="save-button"
        (click)="saveProfile()"
        [disabled]="isSaving || !canSave()">
        <ion-spinner *ngIf="isSaving" name="crescent"></ion-spinner>
        <span *ngIf="!isSaving">Enregistrer les modifications</span>
      </ion-button>

    </form>

    <!-- Input fichier caché -->
    <input
      type="file"
      #fileInput
      accept="image/*"
      (change)="onFileSelected($event)"
      hidden
    />

  </div>
</ion-content>
