<ion-content class="login-container" [fullscreen]="true">
  <div class="login-wrapper">

    <!-- HEADER -->
    <div class="header-section">
      <div class="nav-section">
        <ion-button fill="clear" color="dark" routerLink="/" class="back-button">
          <ion-icon name="chevron-back"></ion-icon>
        </ion-button>
      </div>

      <div class="logo-container">
        <img src="assets/logo.svg" alt="MySchool Logo" class="logo" />
      </div>
    </div>

    <!-- CONTENT -->
    <div class="main-content">

      <!-- TITLES -->
      <div class="titles-section">
        <h1 class="main-title">Connexion Admin</h1>
        <p class="subtitle">
          Connectez-vous avec votre email et mot de passe
        </p>
      </div>

      <!-- FORM -->
      <form [formGroup]="loginForm" class="form-container-modern">

        <div class="input-group-modern">
          <label class="input-label-modern">Email ou téléphone</label>

          <div class="phone-input-wrapper">
            <ion-input [type]="isPhone ? 'tel' : 'email'" placeholder="admin@myschool.com ou +221 77 000 00 00"
              formControlName="login" (ionInput)="detectInputType($event)">
            </ion-input>
          </div>

          <div class="error-text" *ngIf="loginForm.get('login')?.invalid && loginForm.get('login')?.touched">
            Email ou numéro de téléphone invalide
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="input-group-modern">
          <label class="input-label-modern">Mot de passe</label>

          <div class="phone-input-wrapper">
            <ion-input type="password" placeholder="********" formControlName="password">
            </ion-input>
          </div>

          <div class="error-text" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            Mot de passe requis
          </div>
        </div>

        <!-- BUTTON -->
        <ion-button expand="block" class="modern-primary-button" [disabled]="loginForm.invalid || loading"
          (click)="login()">

          {{ loading ? 'Connexion...' : 'Se connecter' }}

        </ion-button>

      </form>

    </div>
  </div>
</ion-content>
