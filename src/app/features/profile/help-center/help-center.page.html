<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="chevron-back-outline"></ion-icon>
        <span class="back-text">Retour</span>
      </ion-button>
    </ion-buttons>
    <ion-title>Centre d'aide</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="help-center-container">

    <p class="intro-text">Trouvez rapidement une réponse à votre question</p>

    <!-- Barre de recherche -->
    <ion-item class="search-item" lines="none">
      <ion-input placeholder="Rechercher une question..." [(ngModel)]="searchQuery" (ionInput)="onSearch()" clearInput>
      </ion-input>
    </ion-item>

    <!-- Loader -->
    <div class="loading" *ngIf="loading">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Chargement des questions...</p>
    </div>

    <!-- FAQs groupées par catégorie -->
    <div *ngIf="!loading && categories.length > 0; else noResults">
      <div *ngFor="let cat of categories">
        <h2 class="category-title">{{ cat.title }}</h2>

        <ion-accordion-group>
          <ion-accordion *ngFor="let faq of cat.faqs">
            <ion-item slot="header">
              <ion-label class="question-label">{{ faq.question }}</ion-label>
            </ion-item>
            <div class="ion-padding answer-content" slot="content">
              <p [innerHTML]="faq.answer"></p>
            </div>
          </ion-accordion>
        </ion-accordion-group>
      </div>
    </div>

    <!-- Aucune FAQ trouvée -->
    <ng-template #noResults>
      <div class="no-results" *ngIf="!loading">
        <ion-icon name="information-circle-outline" color="medium" size="large"></ion-icon>
        <p>Aucune question ne correspond à votre recherche.</p>
      </div>
    </ng-template>

    <!-- Bouton support -->
    <ion-button expand="block" fill="outline" class="contact-button" (click)="contactSupport()">
      Contacter le support
    </ion-button>

  </div>
</ion-content>
