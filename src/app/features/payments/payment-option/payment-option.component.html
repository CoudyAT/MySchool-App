<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Retour</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-container">
    <h1 class="page-title">Choisir une méthode<br>de paiement</h1>

<div class="payment-methods">
  <!-- ✅ Wave (ACTIF) -->
  <div class="wave-card" >
    <img src="assets/wave.svg" alt="Wave" class="penguin-svg">
  </div>

  <!-- ❌ Orange Money (INDISPONIBLE) -->
  <div class="payment-disabled">
    <img src="assets/orange-money.svg" alt="Orange Money" class="penguin-svg">
    <span class="disabled-label">Indisponible</span>
  </div>

  <!-- ❌ Yas Mixx (INDISPONIBLE) -->
  <div class="payment-disabled">
    <img src="assets/yas.svg" alt="Yas Mixx" class="penguin-svg">
    <span class="disabled-label">Indisponible</span>
  </div>

  <!-- ❌ Carte bancaire (INDISPONIBLE) -->
  <div class="payment-card card-payment payment-disabled">
    <div class="card-content">
      <div class="card-chip"></div>
      <span class="card-text">Carte bancaire</span>
    </div>
    <span class="disabled-label">Indisponible</span>
  </div>
</div>

  </div>
</ion-content>
