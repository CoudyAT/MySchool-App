<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Retour</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-container">
    <h1 class="page-title">Choisir une méthode<br>de paiement</h1>

    <!-- Formulaire Orange Money (affiché si showPhoneInput est true) -->
    <div class="phone-input-modal" *ngIf="showPhoneInput">
      <div class="modal-backdrop" (click)="cancelPhoneInput()"></div>
      <div class="modal-content">
        <h2>Paiement Orange Money</h2>
        <p class="modal-subtitle">Entrez vos informations pour continuer</p>

        <ion-item>
          <ion-label position="floating">Nom complet</ion-label>
          <ion-input [(ngModel)]="customerName" type="text" placeholder="Ex: Mamadou Diop"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Email</ion-label>
          <ion-input [(ngModel)]="customerEmail" type="email" placeholder="Ex: mamadou@example.com"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Numéro de téléphone</ion-label>
          <ion-input [(ngModel)]="customerPhone" type="tel" placeholder="+221 77 123 45 67"></ion-input>
        </ion-item>

        <p class="phone-hint">Format accepté: +221 7X XXX XX XX (Senegal uniquement)</p>

        <div class="modal-actions">
          <ion-button expand="block" (click)="confirmOrangeMoneyPayment()">
            Continuer
          </ion-button>
          <ion-button expand="block" fill="outline" (click)="cancelPhoneInput()">
            Annuler
          </ion-button>
        </div>
      </div>
    </div>

    <div class="payment-methods">
      <!-- Wave -->
      <div class="wave-card" (click)="selectPaymentMethod(paymentMethods[0])">
          <img src="assets/wave.svg" alt="MySchool Logo" class="penguin-svg">
      </div>

      <!-- Orange Money -->
      <div (click)="selectPaymentMethod(paymentMethods[1])">
        <img src="assets/orange-money.svg" alt="MySchool Logo" class="penguin-svg">
      </div>

      <!-- Yas Mixx -->
      <div (click)="selectPaymentMethod(paymentMethods[2])">
        <img src="assets/yas.svg" alt="MySchool Logo" class="penguin-svg">
      </div>

      <!-- Carte bancaire -->
      <div class="payment-card card-payment" (click)="selectPaymentMethod(paymentMethods[3])">
        <div class="card-content">
          <div class="card-chip"></div>
          <span class="card-text">Carte bancaire</span>
        </div>
      </div>
    </div>
  </div>
</ion-content>
