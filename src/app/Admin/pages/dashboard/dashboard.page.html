<div class="p-6 bg-gray-100 min-h-screen">
  <div class="content">
    <div class="header-section">
      <div class="header">
        <div>
          <h1 class="title">Tableau de Bord</h1>
          <p class="subtitle">Gérez les utilisateurs, les cours et les instructeurs.</p>
        </div>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
      <!-- Total -->
      <div class="stat-card stat-card-total">
        <div class="stat-card-content">
          <div class="stat-card-left">
            <div class="stat-badge">
              <div class="status-dot dot-blue"></div>
              <p class="stat-label">TOTAL</p>
            </div>
            <p class="stat-number">test</p>
            <p class="stat-description text-blue">Utilisateurs inscrits</p>
          </div>
          <div class="stat-icon bg-blue">
            <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Actifs -->
      <div class="stat-card stat-card-progress">
        <div class="stat-card-content">
          <div class="stat-card-left">
            <div class="stat-badge">
              <div class="status-dot dot-amber animate-pulse"></div>
              <p class="stat-label">ACTIFS</p>
            </div>
            <p class="stat-number">test</p>
            <p class="stat-description text-amber">Utilisateurs actifs</p>
          </div>
          <div class="stat-icon bg-amber">
            <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Inactifs -->
      <div class="stat-card stat-card-fall">
        <div class="stat-card-content">
          <div class="stat-card-left">
            <div class="stat-badge">
              <div class="status-dot dot-red"></div>
              <p class="stat-label">INACTIFS</p>
            </div>
            <p class="stat-number">test</p>
            <p class="stat-description text-red">Utilisateurs inactifs/suspendus</p>
          </div>
          <div class="stat-icon bg-red">
            <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
