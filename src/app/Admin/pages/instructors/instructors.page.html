<div class="p-6 bg-gray-100 min-h-screen">
  <div class="content">
    <!-- Loader -->
    <div *ngIf="isLoading" class="loader-container">
      <div class="spinner"></div>
      <p class="loader-text">Chargement des instructeurs...</p>
    </div>
    <div *ngIf="!isLoading">

      <!-- Header avec bouton d'ajout -->
      <div class="header-section">
        <div class="header">
          <div>
            <h1 class="title">Liste des instructeurs</h1>
            <p class="subtitle">Découvrez et gérez vos instructeurs</p>
          </div>

        </div>
      </div>

      <!-- Stats Cards -->


      <!-- Filtres et recherche -->
      <div class="filters-section">
        <div class="search-wrapper">
          <div class="search-container">
            <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input type="text" placeholder="Rechercher un utilisateur..." class="search-input" [(ngModel)]="searchText"
              (input)="onSearchChange()">
            <button *ngIf="searchText" (click)="clearSearch()" class="clear-button">
              ✕
            </button>
          </div>
        </div>
      </div>

      <!-- Liste des utilisateurs -->
      <div *ngIf="filteredInstructors.length > 0;" class="users-list">

        <!-- Header de la liste -->
        <div class="users-list-header">
          <span>Utilisateur</span>
          <span>Biographie</span>
          <span>Expertise</span>
          <!-- <span>Premium</span>
          <span>Statut</span> -->
          <span>Actions</span>
        </div>

        <div *ngFor="let inst of paginatedInstructors" class="user-row">

          <!-- Utilisateur -->
          <div class="user-info">
            <div class="user-avatar">
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <p class="user-name">{{ inst.name }}</p>
          </div>

          <!-- Téléphone -->
          <div class="user-cell">
            {{ inst.bio }}
          </div>

          <!-- Rôle -->
          <div class="user-cell">
            {{ inst.expertise }}
          </div>



          <!-- Actions -->

        </div>
        <ng-template #emptyState>
          <div class="empty-state">
            <div class="empty-icon">
              <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <h2 class="empty-title">Aucun utilisateur trouvé</h2>
            <p class="empty-text">Essayez d'ajuster votre recherche ou ajoutez un nouvel utilisateur.</p>
          </div>
        </ng-template>

        <!-- Pagination -->
        <div *ngIf="filteredInstructors.length > 0 && totalPages > 1" class="pagination">
          <button (click)="previousPage()" [disabled]="currentPage === 1" class="page-button"
            [class.page-button-disabled]="currentPage === 1">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Précédent
          </button>

          <div class="page-numbers">
            <button *ngFor="let page of getPageNumbers()" (click)="page > 0 ? goToPage(page) : null"
              [disabled]="page === -1" class="page-number" [class.page-number-active]="currentPage === page"
              [class.page-number-ellipsis]="page === -1">
              {{ page === -1 ? '...' : page }}
            </button>
          </div>

          <button (click)="nextPage()" [disabled]="currentPage === totalPages" class="page-button"
            [class.page-button-disabled]="currentPage === totalPages">
            Suivant
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
