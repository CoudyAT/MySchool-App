<form [formGroup]="courseForm" class="course-form" (ngSubmit)="submitForm()">
  <div class="form-grid">

    <!-- Type de cours -->
    <div class="form-group">
      <label for="type" class="form-label">Type du cours</label>
      <select id="type" formControlName="type" class="form-input">
        <option value="">Sélectionnez un type</option>
        <option value="En ligne">En ligne</option>
        <option value="Présentiel">Présentiel</option>
        <option value="Hybride">Hybride</option>
      </select>
    </div>
    <!-- Prix -->
    <div class="form-group">
      <label for="price" class="form-label">Prix (FCFA)</label>
      <input id="price" type="number" formControlName="price" class="form-input" placeholder="0" min="0" />
    </div>
    <!-- Upload de l'image de couverture -->
    <div class="form-group full-width">
      <label class="form-label">Image de couverture</label>

      <div class="image-upload-container" (click)="fileInput.click()">
        <img *ngIf="imagePreview" [src]="imagePreview" alt="Prévisualisation de l'image de couverture"
          class="image-preview" />
        <div *ngIf="!imagePreview" class="upload-placeholder">
          <ion-icon name="image-outline" size="large"></ion-icon>
          <p class="upload-text">Cliquez pour ajouter une image de couverture</p>
          <span class="upload-hint">Recommandé : 1200x600px (JPG, PNG)</span>
        </div>
      </div>

      <input #fileInput type="file" accept="image/*" (change)="onFileSelected($event)" hidden />
    </div>
    <!-- Titre du cours -->
    <div class="form-group">
      <label for="title" class="form-label">Titre du cours <span class="required">*</span></label>
      <input id="title" type="text" formControlName="title" class="form-input"
        placeholder="Ex: Introduction à Angular" />
      <div *ngIf="courseForm.get('title')?.invalid && courseForm.get('title')?.touched" class="error-message">
        Le titre est requis
      </div>
    </div>

    <!-- Professeur / Formateur -->
    <div class="form-group">
      <label for="instructor" class="form-label">
        Professeur <span class="required">*</span>
      </label>
      <select id="instructor" formControlName="instructorId" class="form-input">
        <option value="">Sélectionnez un professeur</option>
        <option *ngFor="let prof of instructors" [value]="prof.id">
          {{ prof.name }}
          <ng-container *ngIf="prof.title"> • {{ prof.title }}</ng-container>
        </option>
      </select>

      <!-- Message d'erreur -->
      <div *ngIf="courseForm.get('instructorId')?.invalid && courseForm.get('instructorId')?.touched"
        class="error-message">
        Veuillez sélectionner un professeur
      </div>
    </div>

    <!-- Catégorie -->
    <div class="form-group">
      <label class="form-label">Catégorie <span class="required">*</span></label>

      <!-- Sélection ou ajout de catégorie -->
      <div class="category-selector">
        <select formControlName="selectedCategoryOption" class="form-input">
          <option value="">Sélectionnez une catégorie</option>
          <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
          <option value="__add_new__">+ Ajouter une nouvelle catégorie...</option>
        </select>

        <div *ngIf="showNewCategoryInput" class="new-category-input ml-2">
          <input type="text" formControlName="newCategoryName" placeholder="Nom de la nouvelle catégorie"
            class="form-input" (blur)="addNewCategoryIfValid()" (keyup.enter)="addNewCategoryIfValid()" />
          <button type="button" class="btn-small btn-secondary ml-2" (click)="cancelNewCategory()">
            Annuler
          </button>
        </div>
      </div>

      <!-- Message d'erreur pour la catégorie principale -->
      <div *ngIf="courseForm.get('category')?.invalid && courseForm.get('category')?.touched" class="error-message">
        La catégorie est requise
      </div>
    </div>



    <!-- Description -->
    <div class="form-group full-width">
      <label for="description" class="form-label">Description</label>
      <textarea id="description" formControlName="description" class="form-textarea"
        placeholder="Décrivez le contenu et les objectifs du cours..." rows="5"></textarea>
    </div>

    <!-- Sessions -->
    <div class="form-group">
      <label for="sessions" class="form-label">Nombre de sessions</label>
      <input id="sessions" type="number" formControlName="sessions" class="form-input" placeholder="Ex: 12" min="0" />
    </div>

    <!-- Exercices -->
    <div class="form-group">
      <label for="exercises" class="form-label">Nombre d'exercices</label>
      <input id="exercises" type="number" formControlName="exercises" class="form-input" placeholder="Ex: 25" min="0" />
    </div>

    <!-- Niveau -->
    <div class="form-group">
      <label for="level" class="form-label">Niveau</label>
      <select id="level" formControlName="level" class="form-input">
        <option value="">Sélectionnez un niveau</option>
        <option value="Débutant">Débutant</option>
        <option value="Intermédiaire">Intermédiaire</option>
        <option value="Avancé">Avancé</option>
      </select>
    </div>


    <!-- Durée -->
    <div class="form-group">
      <label for="duration" class="form-label">Durée (heures)</label>
      <input id="duration" type="number" formControlName="duration" class="form-input" placeholder="Ex: 40" min="0" />
    </div>

    <!-- Support de cours -->
    <div class="form-group">
      <label for="support" class="form-label">Support de cours (PDF)</label>
      <input id="support" type="file" accept=".pdf" (change)="onPdfSelected($event)" class="form-input file-input" />
      <small class="file-hint">Fichier PDF uniquement</small>
    </div>

    <!-- Certificat disponible -->
    <div class="form-group full-width">
      <label class="checkbox-container">
        <input type="checkbox" formControlName="certificateAvailable" class="checkbox-input" />
        <span class="checkmark"></span>
        Certificat disponible à la fin du cours
      </label>
    </div>
  </div>

  <div class="form-actions">
    <button type="button" (click)="cancel.emit()" class="btn-secondary">
      Annuler
    </button>
    <button type="submit" [disabled]="courseForm.invalid" class="btn-primary">
      Créer le cours
    </button>
  </div>
</form>
