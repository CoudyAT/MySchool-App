  <!-- Main Content -->
  <div class="main">
    <header class="topbar">
      <div class="left">
        <button class="menu-toggle"><i class="bi bi-list"></i></button>
        <span class="app-title">Myschool</span>
      </div>

      <div class="center">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Rechercher" />
        </div>
      </div>

      <div class="right">
        <div class="profile" (click)="toggleProfileMenu()">
            <img [src]="currentUser?.photoURL || 'https://ui-avatars.com/api/?name=' + (currentUser?.firstName || 'Admin')" alt="profil" />
            <div class="profile-info">
              <strong>{{ currentUser?.firstName }} {{ currentUser?.lastName }}</strong>
              <span class="role">ADMIN</span>
            </div>
            <i class="bi bi-caret-down-fill"></i>

          <!-- Dropdown menu -->
          <div class="profile-menu" *ngIf="showProfileMenu">
            <button (click)="logout()">Déconnexion</button>
            <button (click)="updatePassword()">Modifier le mot de passe</button>
          </div>
        </div>

      </div>

    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
